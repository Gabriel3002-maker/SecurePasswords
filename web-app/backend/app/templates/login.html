<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestor de Contraseñas</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-sans);
            overflow: hidden;
        }

        .animated-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--gradient-animated);
            background-size: 400% 400%;
            animation: gradient-shift 15s ease infinite;
            z-index: -1;
        }

        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 70%;
            left: 80%;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 40%;
            left: 70%;
            animation-delay: 4s;
        }

        .login-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            padding: 1rem;
            animation: scale-in 0.5s ease-out;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-2xl);
            padding: 3rem 2.5rem;
            box-shadow: var(--shadow-2xl);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            font-size: 4rem;
            margin-bottom: 0.5rem;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        .logo h1 {
            font-size: 1.875rem;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }

        .logo p {
            color: var(--color-gray-600);
            font-size: 0.875rem;
            margin: 0.5rem 0 0 0;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            background: var(--color-gray-100);
            padding: 0.25rem;
            border-radius: var(--radius-lg);
        }

        .tab {
            flex: 1;
            padding: 0.75rem;
            border: none;
            background: transparent;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-family: var(--font-sans);
            color: var(--color-gray-600);
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .tab.active {
            background: var(--color-white);
            color: var(--color-primary);
            box-shadow: var(--shadow-sm);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: var(--color-gray-700);
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--color-gray-200);
            border-radius: var(--radius-lg);
            font-family: var(--font-sans);
            font-size: 1rem;
            transition: all var(--transition-base);
            background: var(--color-white);
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1), var(--shadow-glow);
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: var(--radius-lg);
            background: var(--gradient-primary);
            color: var(--color-white);
            font-weight: 700;
            font-size: 1rem;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: all var(--transition-base);
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            box-shadow: var(--shadow-lg), var(--shadow-glow);
            transform: translateY(-2px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .submit-btn .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: var(--color-white);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .submit-btn.loading .spinner {
            display: block;
        }

        .submit-btn.loading .btn-text {
            display: none;
        }

        .message {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: var(--radius-lg);
            font-size: 0.875rem;
            font-weight: 500;
            animation: slide-up var(--transition-base);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .message.success {
            background: rgba(34, 197, 94, 0.1);
            color: #16a34a;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .hint {
            display: block;
            margin-top: 0.5rem;
            color: var(--color-gray-500);
            font-size: 0.8rem;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 640px) {
            .login-card {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="animated-background"></div>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="logo">
                <div class="logo-icon">🔐</div>
                <h1>Gestor de Contraseñas</h1>
                <p>Protege tus credenciales de forma segura</p>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" id="loginTab" onclick="showTab('login')">
                    Iniciar Sesión
                </button>
                <button class="tab" id="registerTab" onclick="showTab('register')">
                    Registrarse
                </button>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" id="loginEmail" class="form-input" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="loginPassword" class="form-input" required
                        autocomplete="current-password">
                </div>
                <button type="submit" class="submit-btn">
                    <span class="btn-text">Iniciar Sesión</span>
                    <div class="spinner"></div>
                </button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="hidden">
                <div class="form-group">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" id="registerName" class="form-input" autocomplete="name">
                </div>
                <div class="form-group">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" id="registerEmail" class="form-input" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="registerPassword" class="form-input" required
                        autocomplete="new-password">
                </div>
                <button type="submit" class="submit-btn">
                    <span class="btn-text">Crear Cuenta</span>
                    <div class="spinner"></div>
                </button>
            </form>

            <!-- Message -->
            <div id="message" class="message hidden"></div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        function showTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const message = document.getElementById('message');

            message.classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
            }
        }

        function showMessage(text, isError = false) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = `message ${isError ? 'error' : 'success'}`;
            setTimeout(() => message.classList.add('hidden'), 5000);
        }

        function setButtonLoading(button, loading) {
            if (loading) {
                button.classList.add('loading');
            } else {
                button.classList.remove('loading');
            }
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const button = e.target.querySelector('.submit-btn');
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            setButtonLoading(button, true);

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('¡Bienvenido! Redirigiendo...');
                    setTimeout(() => window.location.href = '/dashboard', 1000);
                } else {
                    setButtonLoading(button, false);
                    showMessage(data.detail || 'Error al iniciar sesión', true);
                }
            } catch (error) {
                setButtonLoading(button, false);
                showMessage('Error de conexión', true);
            }
        });

        // Register
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const button = e.target.querySelector('.submit-btn');
            const full_name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            setButtonLoading(button, true);

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, full_name })
                });

                const data = await response.json();

                if (response.ok) {
                    setButtonLoading(button, false);
                    showMessage('Cuenta creada exitosamente. Ahora puedes iniciar sesión.');
                    setTimeout(() => showTab('login'), 2000);
                } else {
                    setButtonLoading(button, false);
                    showMessage(data.detail || 'Error al registrarse', true);
                }
            } catch (error) {
                setButtonLoading(button, false);
                showMessage('Error de conexión', true);
            }
        });
    </script>
</body>

</html>
