<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseñas - Gestor</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        /* Reuse navbar and sidebar from dashboard */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 4rem;
        }

        .navbar-brand {
            font-size: 1.25rem;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .navbar-user {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-name {
            color: var(--color-gray-700);
            font-weight: 600;
        }

        .logout-btn {
            padding: 0.5rem 1.25rem;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .logout-btn:hover {
            box-shadow: var(--shadow-md), var(--shadow-glow);
            transform: translateY(-2px);
        }

        .app-layout {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
        }

        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            min-height: calc(100vh - 4rem);
            padding: 2rem 0;
            box-shadow: var(--shadow-md);
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 0 1rem;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            color: var(--color-gray-700);
            text-decoration: none;
            border-radius: var(--radius-lg);
            transition: all var(--transition-base);
            font-weight: 500;
        }

        .nav-link:hover {
            background: var(--color-gray-100);
            transform: translateX(4px);
        }

        .nav-link.active {
            background: var(--gradient-primary);
            color: white;
            box-shadow: var(--shadow-md);
        }

        .nav-icon {
            font-size: 1.5rem;
        }

        .main-content {
            flex: 1;
            padding: 2rem;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--color-gray-900);
        }

        .add-btn {
            padding: 0.875rem 1.5rem;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-base);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .add-btn:hover {
            box-shadow: var(--shadow-lg), var(--shadow-glow);
            transform: translateY(-2px);
        }

        /* Password Cards */
        .passwords-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .password-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 1.75rem;
            box-shadow: var(--shadow-md);
            transition: all var(--transition-base);
            border-top: 4px solid var(--color-primary);
            position: relative;
            overflow: hidden;
        }

        .password-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-gray-900);
            margin-bottom: 0.25rem;
        }

        .card-subtitle {
            font-size: 0.875rem;
            color: var(--color-gray-600);
            font-family: var(--font-mono);
        }

        .shared-badge {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(59, 130, 246, 0.2) 100%);
            color: var(--color-info);
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .card-actions .action-btn {
            flex: 1 1 calc(50% - 0.25rem);
            min-width: 80px;
        }

        .action-btn {
            padding: 0.625rem;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .action-btn.view {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.1) 0%, rgba(124, 58, 237, 0.15) 100%);
            color: var(--color-primary);
        }

        .action-btn.edit {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(59, 130, 246, 0.15) 100%);
            color: var(--color-info);
        }

        .action-btn.delete {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, rgba(239, 68, 68, 0.15) 100%);
            color: var(--color-error);
        }

        .action-btn.share {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1) 0%, rgba(34, 197, 94, 0.15) 100%);
            color: var(--color-success);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-gray-900);
            margin-bottom: 0.5rem;
        }

        .empty-text {
            color: var(--color-gray-600);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fade-in 0.2s ease-out;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: white;
            border-radius: var(--radius-2xl);
            padding: 2.5rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-2xl);
            animation: slide-up 0.3s ease-out;
        }

        .modal-title {
            font-size: 1.875rem;
            font-weight: 800;
            color: var(--color-gray-900);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: var(--color-gray-700);
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--color-gray-200);
            border-radius: var(--radius-lg);
            font-family: var(--font-sans);
            font-size: 1rem;
            transition: all var(--transition-base);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .password-input-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.25rem;
            opacity: 0.6;
            transition: opacity var(--transition-base);
        }

        .toggle-password:hover {
            opacity: 1;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 1.25rem;
            height: 1.25rem;
            cursor: pointer;
        }

        .modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 2rem;
        }

        .modal-btn {
            padding: 0.875rem;
            border: none;
            border-radius: var(--radius-lg);
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .modal-btn.primary {
            background: var(--gradient-primary);
            color: white;
            box-shadow: var(--shadow-md);
        }

        .modal-btn.primary:hover {
            box-shadow: var(--shadow-lg), var(--shadow-glow);
            transform: translateY(-2px);
        }

        .modal-btn.secondary {
            background: var(--color-gray-200);
            color: var(--color-gray-700);
        }

        .modal-btn.secondary:hover {
            background: var(--color-gray-300);
        }

        .hidden {
            display: none !important;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: white;
            padding: 1rem 1.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slide-up 0.3s ease-out;
            z-index: 2000;
        }

        .toast.success {
            border-left: 4px solid var(--color-success);
        }

        .toast.error {
            border-left: 4px solid var(--color-error);
        }

        /* Permission Modal Styles */
        .users-list {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 1rem;
        }

        .user-item {
            padding: 1rem;
            border: 2px solid var(--color-gray-200);
            border-radius: var(--radius-lg);
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .user-item:hover {
            border-color: var(--color-primary);
            background: rgba(124, 58, 237, 0.05);
        }

        .user-item.selected {
            border-color: var(--color-primary);
            background: rgba(124, 58, 237, 0.1);
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .permissions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .permission-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .permission-item input[type="checkbox"] {
            width: 1.25rem;
            height: 1.25rem;
            cursor: pointer;
        }

        @media (max-width: 1024px) {
            .sidebar {
                display: none;
            }
        }

        @media (max-width: 640px) {
            .navbar-content {
                padding: 0 1rem;
            }

            .main-content {
                padding: 1rem;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .passwords-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-content">
            <div class="navbar-brand">
                <span>🔐</span>
                Gestor de Contraseñas
            </div>
            <div class="navbar-user">
                <span class="user-name" id="userName"></span>
                <button onclick="logout()" class="logout-btn">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-link">
                    <span class="nav-icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="/passwords" class="nav-link active">
                    <span class="nav-icon">🔑</span>
                    <span>Contraseñas</span>
                </a>
                <a href="/ssh" class="nav-link">
                    <span class="nav-icon">💻</span>
                    <span>Terminal SSH</span>
                </a>
                <a href="/admin" id="adminLink" class="nav-link" style="display: none;">
                    <span class="nav-icon">⚙️</span>
                    <span>Administración</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">Contraseñas</h1>
                <button onclick="showModal()" class="add-btn">
                    <span>➕</span>
                    <span>Nueva Contraseña</span>
                </button>
            </div>

            <!-- Passwords Grid -->
            <div id="passwordsList" class="passwords-grid">
                <!-- Will be filled dynamically -->
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="passwordModal" class="modal-overlay hidden" onclick="handleModalClick(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 id="modalTitle" class="modal-title">Nueva Contraseña</h2>
            <form id="passwordForm">
                <input type="hidden" id="credentialId">

                <div class="form-group">
                    <label class="form-label">Host/Servidor</label>
                    <input type="text" id="host" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Usuario</label>
                    <input type="text" id="username" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" class="form-input" required>
                        <button type="button" onclick="togglePassword()" class="toggle-password">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Puerto (opcional)</label>
                    <input type="number" id="port" class="form-input" placeholder="22">
                </div>

                <div class="form-group">
                    <label class="form-label">Comentario</label>
                    <input type="text" id="comment" class="form-input" placeholder="Descripción opcional">
                </div>

                <div class="form-group">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="is_shared">
                        <label for="is_shared" class="form-label" style="margin: 0;">Compartir con organización</label>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="submit" class="modal-btn primary">Guardar</button>
                    <button type="button" onclick="hideModal()" class="modal-btn secondary">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Share Permission Modal -->
    <div id="shareModal" class="modal-overlay hidden" onclick="handleShareModalClick(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 class="modal-title">Compartir Contraseña</h2>
            <input type="hidden" id="shareCredentialId">

            <div class="form-group">
                <label class="form-label">Selecciona un usuario</label>
                <div class="users-list" id="usersList">
                    <!-- Will be filled dynamically -->
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Permisos</label>
                <div class="permissions-grid">
                    <div class="permission-item">
                        <input type="checkbox" id="perm_view" checked>
                        <label for="perm_view">Ver contraseña</label>
                    </div>
                    <div class="permission-item">
                        <input type="checkbox" id="perm_edit">
                        <label for="perm_edit">Editar</label>
                    </div>
                    <div class="permission-item">
                        <input type="checkbox" id="perm_delete">
                        <label for="perm_delete">Eliminar</label>
                    </div>
                    <div class="permission-item">
                        <input type="checkbox" id="perm_ssh" checked>
                        <label for="perm_ssh">Conectar SSH</label>
                    </div>
                </div>
            </div>

            <div class="modal-actions">
                <button onclick="assignPermission()" class="modal-btn primary">Compartir</button>
                <button onclick="hideShareModal()" class="modal-btn secondary">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const host = window.location.host;
        const API_URL = `${window.location.protocol}//${host}/api`;
        const user = {{ user | tojson }};

        document.getElementById('userName').textContent = user.full_name || user.email;
        if (user.role === 'admin') {
            document.getElementById('adminLink').style.display = 'flex';
        }

        async function loadPasswords() {
            try {
                const response = await fetch(`${API_URL}/credentials/`, {
                    credentials: 'include'
                });

                if (response.ok) {
                    const credentials = await response.json();
                    displayPasswords(credentials);
                } else if (response.status === 401) {
                    logout();
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Error al cargar contraseñas', 'error');
            }
        }

        function displayPasswords(credentials) {
            const container = document.getElementById('passwordsList');

            if (credentials.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-icon">🔐</div>
                        <h3 class="empty-title">No hay contraseñas guardadas</h3>
                        <p class="empty-text">Comienza agregando tu primera contraseña</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = credentials.map(cred => {
                const perms = cred.user_permissions || {};
                const isOwnerOrAdmin = user.role === 'admin' || cred.created_by === user.id;

                return `
                <div class="password-card">
                    <div class="card-header">
                        <div>
                            <h3 class="card-title">${cred.comment || cred.host}</h3>
                            <p class="card-subtitle">${cred.username}@${cred.host}</p>
                        </div>
                        ${cred.is_shared ? '<span class="shared-badge">Compartida</span>' : ''}
                    </div>
                    <div class="card-actions">
                        ${perms.can_view ? `<button onclick="viewPassword('${cred.id}')" class="action-btn view">Ver</button>` : ''}
                        ${perms.can_edit ? `<button onclick="editPassword('${cred.id}')" class="action-btn edit">Editar</button>` : ''}
                        ${perms.can_delete ? `<button onclick="deletePassword('${cred.id}')" class="action-btn delete">Eliminar</button>` : ''}
                        ${perms.can_connect_ssh ? `<button onclick="connectSSH('${cred.id}')" class="action-btn" style="background: linear-gradient(135deg, rgba(34, 197, 94, 0.1) 0%, rgba(34, 197, 94, 0.15) 100%); color: var(--color-success);">SSH</button>` : ''}
                        ${isOwnerOrAdmin ? `<button onclick="showShareModal('${cred.id}')" class="action-btn share">Compartir</button>` : ''}
                    </div>
                </div>
            `}).join('');
        }

        function showModal(credentialId = null) {
            document.getElementById('passwordModal').classList.remove('hidden');
            document.getElementById('credentialId').value = credentialId || '';
            document.getElementById('modalTitle').textContent = credentialId ? 'Editar Contraseña' : 'Nueva Contraseña';
            if (!credentialId) document.getElementById('passwordForm').reset();
        }

        function hideModal() {
            document.getElementById('passwordModal').classList.add('hidden');
            document.getElementById('passwordForm').reset();
        }

        function handleModalClick(event) {
            if (event.target.id === 'passwordModal') {
                hideModal();
            }
        }

        function togglePassword() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        async function viewPassword(id) {
            try {
                const response = await fetch(`${API_URL}/credentials/${id}`, {
                    credentials: 'include'
                });

                if (response.ok) {
                    const cred = await response.json();
                    const message = `Contraseña: ${cred.password}\n\nHost: ${cred.host}\nUsuario: ${cred.username}\nPuerto: ${cred.port || 22}`;
                    alert(message);

                    // Copy to clipboard
                    navigator.clipboard.writeText(cred.password);
                    showToast('Contraseña copiada al portapapeles', 'success');
                }
            } catch (error) {
                showToast('Error al obtener contraseña', 'error');
            }
        }

        async function editPassword(id) {
            try {
                const response = await fetch(`${API_URL}/credentials/${id}`, {
                    credentials: 'include'
                });

                if (response.ok) {
                    const cred = await response.json();
                    document.getElementById('credentialId').value = cred.id;
                    document.getElementById('host').value = cred.host;
                    document.getElementById('username').value = cred.username;
                    document.getElementById('password').value = cred.password;
                    document.getElementById('port').value = cred.port || '';
                    document.getElementById('comment').value = cred.comment || '';
                    document.getElementById('is_shared').checked = cred.is_shared;
                    showModal(cred.id);
                }
            } catch (error) {
                showToast('Error al cargar credencial', 'error');
            }
        }

        async function deletePassword(id) {
            if (!confirm('¿Estás seguro de eliminar esta contraseña?')) return;

            try {
                const response = await fetch(`${API_URL}/credentials/${id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                if (response.ok) {
                    showToast('Contraseña eliminada', 'success');
                    loadPasswords();
                }
            } catch (error) {
                showToast('Error al eliminar', 'error');
            }
        }

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const credentialId = document.getElementById('credentialId').value;
            const data = {
                host: document.getElementById('host').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                port: parseInt(document.getElementById('port').value) || null,
                comment: document.getElementById('comment').value,
                is_shared: document.getElementById('is_shared').checked
            };

            try {
                const url = credentialId ? `${API_URL}/credentials/${credentialId}` : `${API_URL}/credentials/`;
                const method = credentialId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    hideModal();
                    showToast(credentialId ? 'Contraseña actualizada' : 'Contraseña creada', 'success');
                    loadPasswords();
                } else {
                    showToast('Error al guardar', 'error');
                }
            } catch (error) {
                showToast('Error de conexión', 'error');
            }
        });

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'fade-out 0.3s ease-out';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        let selectedUserId = null;
        let allUsers = [];

        async function loadUsersForSharing() {
            if (user.role !== 'admin') return;

            try {
                const response = await fetch(`${API_URL}/admin/users`, {
                    credentials: 'include'
                });

                if (response.ok) {
                    allUsers = await response.json();
                    // Filter out current user
                    allUsers = allUsers.filter(u => u.id !== user.id);
                }
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        function showShareModal(credentialId) {
            document.getElementById('shareModal').classList.remove('hidden');
            document.getElementById('shareCredentialId').value = credentialId;
            selectedUserId = null;

            // Display users
            const usersList = document.getElementById('usersList');
            usersList.innerHTML = allUsers.map(u => `
                <div class="user-item" onclick="selectUser('${u.id}')">
                    <div class="user-info">
                        <div>
                            <div style="font-weight: 600;">${u.full_name || 'Sin nombre'}</div>
                            <div style="font-size: 0.875rem; color: var(--color-gray-600);">${u.email}</div>
                        </div>
                        <span class="role-badge ${u.role}">${u.role === 'admin' ? 'Admin' : 'Usuario'}</span>
                    </div>
                </div>
            `).join('');
        }

        function hideShareModal() {
            document.getElementById('shareModal').classList.add('hidden');
            selectedUserId = null;
            // Reset checkboxes
            document.getElementById('perm_view').checked = true;
            document.getElementById('perm_edit').checked = false;
            document.getElementById('perm_delete').checked = false;
            document.getElementById('perm_ssh').checked = true;
        }

        function handleShareModalClick(event) {
            if (event.target.id === 'shareModal') {
                hideShareModal();
            }
        }

        function selectUser(userId) {
            selectedUserId = userId;
            // Update UI
            document.querySelectorAll('.user-item').forEach(item => {
                item.classList.remove('selected');
            });
            event.target.closest('.user-item').classList.add('selected');
        }

        async function assignPermission() {
            if (!selectedUserId) {
                showToast('Selecciona un usuario', 'error');
                return;
            }

            const credentialId = document.getElementById('shareCredentialId').value;
            const data = {
                user_id: selectedUserId,
                can_view: document.getElementById('perm_view').checked,
                can_edit: document.getElementById('perm_edit').checked,
                can_delete: document.getElementById('perm_delete').checked,
                can_connect_ssh: document.getElementById('perm_ssh').checked
            };

            try {
                const response = await fetch(`${API_URL}/credentials/${credentialId}/permissions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    hideShareModal();
                    showToast('Permisos asignados exitosamente', 'success');
                } else {
                    const error = await response.json();
                    showToast(error.detail || 'Error al asignar permisos', 'error');
                }
            } catch (error) {
                showToast('Error de conexión', 'error');
            }
        }

        function connectSSH(credentialId) {
            // Redirigir a la página SSH y conectar automáticamente
            window.location.href = `/ssh?connect=${credentialId}`;
        }

        async function logout() {
            await fetch(`${API_URL}/auth/logout`, {
                method: 'POST',
                credentials: 'include'
            });
            window.location.href = '/';
        }

        loadPasswords();
        if (user.role === 'admin') {
            loadUsersForSharing();
        }
    </script>
</body>

</html>
