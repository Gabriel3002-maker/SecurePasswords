{% extends "layout.html" %}
{% block title %}{{ t('ssh.title') }} - {{ t('auth.page_title') }}{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<style>
    .page-title { font-size: 2.5rem; font-weight: 800; color: var(--color-gray-900); margin-bottom: 2rem; }
    #credentialSelector {
        background: var(--color-white);
        border-radius: var(--radius-xl);
        padding: 1.5rem;
        box-shadow: var(--shadow-md);
        margin-bottom: 1.5rem;
    }
    #credentialSelector h3 {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--color-gray-900);
        margin-bottom: 1rem;
    }
    #credentialsList {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 1rem;
    }
    .cred-btn {
        background: linear-gradient(135deg, rgba(124,58,237,0.05) 0%, rgba(124,58,237,0.1) 100%);
        border: 2px solid transparent;
        padding: 1rem;
        border-radius: var(--radius-lg);
        text-align: left;
        cursor: pointer;
        transition: all var(--transition-base);
        font-family: var(--font-sans);
    }
    .cred-btn:hover {
        border-color: var(--color-primary);
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
    }
    .cred-btn .host-name { font-weight: 700; color: var(--color-gray-900); margin-bottom: 0.25rem; }
    .cred-btn .host-addr { font-size: 0.875rem; color: var(--color-gray-600); font-family: var(--font-mono); }

    #terminalContainer {
        background: #1a1a2e;
        border-radius: var(--radius-xl);
        padding: 1.5rem;
        box-shadow: var(--shadow-xl);
    }
    .terminal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
    }
    .connection-info { color: #4ade80; font-family: var(--font-mono); font-size: 0.9rem; }
    .disconnect-btn {
        background: #ef4444; color: white;
        border: none; padding: 0.5rem 1rem;
        border-radius: var(--radius-md);
        font-weight: 600; cursor: pointer;
        transition: all var(--transition-base);
    }
    .disconnect-btn:hover { background: #dc2626; transform: translateY(-1px); }
    #terminal { height: 500px; }
    .empty-state {
        text-align: center; padding: 2rem; color: var(--color-gray-600);
        grid-column: 1 / -1;
    }
    .hidden { display: none !important; }
</style>
{% endblock %}

{% block content %}
<h1 class="page-title" data-i18n="ssh.title">Terminal SSH</h1>

<div id="credentialSelector">
    <h3 data-i18n="ssh.select_credential">Selecciona una credencial para conectar</h3>
    <div id="credentialsList"></div>
</div>

<div id="terminalContainer" class="hidden">
    <div class="terminal-header">
        <span class="connection-info" id="connectionInfo" data-i18n="ssh.connecting">Conectando...</span>
        <button onclick="disconnectSSH()" class="disconnect-btn" data-i18n="ssh.disconnect">Desconectar</button>
    </div>
    <div id="terminal"></div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    const WS_URL = `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/api`;
    const user = {{ user | tojson }};
    let terminal = null;
    let websocket = null;
    let currentSessionId = null;

    async function loadCredentials() {
        try {
            const response = await fetch(`${API_URL}/credentials/`, { credentials: 'include' });
            if (response.ok) {
                const credentials = await response.json();
                const sshCredentials = credentials.filter(cred => (cred.user_permissions || {}).can_connect_ssh === true);
                displayCredentials(sshCredentials);
            } else if (response.status === 401) logout();
        } catch (error) {
            console.error('Error:', error);
        }
    }

    function displayCredentials(credentials) {
        const container = document.getElementById('credentialsList');
        if (credentials.length === 0) {
            container.innerHTML = `<div class="empty-state"><p style="font-size:1.25rem;margin-bottom:0.5rem;">🔐 ${t('ssh.no_credentials')}</p><p style="font-size:0.875rem;">${t('ssh.no_credentials_help')}</p></div>`;
            return;
        }
        container.innerHTML = credentials.map(cred =>
            `<button onclick="connectSSH('${cred.id}')" class="cred-btn">
                <div class="host-name">${cred.comment || cred.host}</div>
                <div class="host-addr">${cred.username}@${cred.host}:${cred.port || 22}</div>
            </button>`
        ).join('');
    }

    async function connectSSH(credentialId) {
        showToast(t('ssh.connect_start'));
        try {
            const response = await fetch(`${API_URL}/ssh/connect`, {
                method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRF-Token': getCSRFToken()},
                credentials: 'include',
                body: JSON.stringify({ credential_id: credentialId })
            });
            if (response.ok) {
                const data = await response.json();
                currentSessionId = data.session_id;
                document.getElementById('credentialSelector').classList.add('hidden');
                document.getElementById('terminalContainer').classList.remove('hidden');
                initTerminal(data.session_id);
            } else {
                const err = await response.json();
                showToast(err.detail || t('ssh.connect_failed'), 'error');
            }
        } catch (error) {
            showToast(t('ssh.connect_error'), 'error');
        }
    }

    function initTerminal(sessionId) {
        terminal = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            fontFamily: 'Menlo, Monaco, "Courier New", monospace',
            theme: { background: '#1a1a2e', foreground: '#00ff00' }
        });
        const fitAddon = new FitAddon.FitAddon();
        terminal.loadAddon(fitAddon);
        terminal.open(document.getElementById('terminal'));
        fitAddon.fit();

        websocket = new WebSocket(`${WS_URL}/ssh/terminal/${sessionId}`);
        websocket.onopen = () => {
            document.getElementById('connectionInfo').textContent = t('ssh.connecting_state');
            terminal.onData(data => { if (websocket.readyState === WebSocket.OPEN) websocket.send(data); });
        };
        websocket.onmessage = (event) => terminal.write(event.data);
        websocket.onerror = () => terminal.write('\r\n\x1b[1;31m' + t('ssh.error_connection') + '\x1b[0m\r\n');
        websocket.onclose = () => {
            terminal.write('\r\n\x1b[1;33m' + t('ssh.connection_closed') + '\x1b[0m\r\n');
            document.getElementById('connectionInfo').textContent = t('ssh.disconnected_state');
        };
    }

    function disconnectSSH() {
        if (websocket) { websocket.close(); websocket = null; }
        if (terminal) { terminal.dispose(); terminal = null; }
        document.getElementById('terminalContainer').classList.add('hidden');
        document.getElementById('credentialSelector').classList.remove('hidden');
        currentSessionId = null;
        showToast(t('ssh.disconnected'));
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadCredentials();
        const connectId = new URLSearchParams(window.location.search).get('connect');
        if (connectId) setTimeout(() => connectSSH(connectId), 100);
    });
</script>
{% endblock %}
