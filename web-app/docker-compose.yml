services:
  backend:
    build: ./backend
    container_name: password_manager_backend
    ports:
      - "9000:9000"
    volumes:
      - ./data:/app/data
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
