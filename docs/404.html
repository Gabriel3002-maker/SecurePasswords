<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecurePasswords | Redirigiendo...</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: Inter, Arial, sans-serif; background: linear-gradient(135deg, #07111f, #172554); color: #f3f4f6; text-align: center;
    }
    .box { padding: 2rem; }
    h1 { font-size: 1.6rem; margin: 0 0 .6rem; }
    p { color: #9ca3af; margin: 0 0 1.2rem; }
    a { color: #93c5fd; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔐 SecurePasswords</h1>
    <p>Esta página no existe. Redirigiendo al inicio...</p>
    <a href="/">Ir a la página principal</a>
  </div>
  <script>
    (function () {
      var base;
      if (location.hostname.endsWith('github.io')) {
        var parts = location.pathname.split('/').filter(Boolean);
        base = location.origin + (parts.length ? '/' + parts[0] + '/' : '/');
      } else {
        base = location.origin + '/';
      }
      document.querySelector('a').setAttribute('href', base);
      window.location.replace(base);
    })();
  </script>
</body>
</html>
